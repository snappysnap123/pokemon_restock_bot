
name: Pokémon Restock Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-restock-bot
  cancel-in-progress: false

jobs:
  check-restock:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run restock bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python pokemon_restock_bot.py

      - name: Save stock history
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Pokemon Bot Action"
          git add -f pokemon_bot_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Pokémon bot stock history"
            git push
          else
            echo "Stock history unchanged; nothing to commit."
          fi
